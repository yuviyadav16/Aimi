<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimi - Your AI Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0f14;
            --surface-color: #1a1d24;
            --primary-color: #ff3366;
            --secondary-color: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #2d3139;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SPLASH SCREEN FIX --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d0f14 0%, #1a1016 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }

        .logo-container {
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        /* REAL LOGO UPLOADED BY USER */
        .real-logo {
            width: 160px;
            height: 160px;
            border-radius: 35px;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(255, 51, 102, 0.4);
        }

        .app-title {
            margin-top: 20px;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, #ffb3c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* POWERED BY FIX - Pushed slightly up so it doesn't get cut */
        .powered-by {
            position: absolute;
            bottom: 60px; 
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeIn 2s forwards;
            animation-delay: 1s;
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .powered-by span {
            color: var(--primary-color);
            font-weight: 600;
            margin-top: 5px;
        }

        /* --- APP LAYOUT --- */
        #app-container {
            width: 100%;
            max-width: 450px; 
            height: 100vh;
            background-color: var(--bg-color);
            display: none; 
            flex-direction: column;
            position: relative;
        }

        /* Header */
        header {
            padding: 15px 20px;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .active-girl-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* --- SIDE DRAWER MENU (PROFESSIONAL APP FEEL) --- */
        .side-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 280px;
            height: 100vh;
            background-color: var(--surface-color);
            z-index: 10000;
            transition: 0.3s ease-in-out;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .side-menu.open {
            left: 0;
        }

        .menu-header {
            padding: 30px 20px;
            background: linear-gradient(135deg, #1a1d24, #2a1115);
            border-bottom: 1px solid var(--border-color);
        }

        .menu-header img {
            width: 60px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .menu-links {
            padding: 20px 0;
            flex: 1;
        }

        .menu-links div {
            padding: 15px 25px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .menu-links div:hover {
            color: var(--primary-color);
            background: #2a2d36;
        }
        
        .close-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-ai {
            background-color: var(--surface-color);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .msg-user {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            background-color: var(--surface-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background-color: #2a2d36;
            color: white;
            outline: none;
        }

        .send-btn {
            background: var(--primary-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            color: white;
        }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-container">
            <!-- Yeh line tumhare upload kiye logo ko laayegi (Make sure name matches exactly) -->
            <img src="98.30.png" class="real-logo" alt="Aimi Logo" onerror="this.src='https://via.placeholder.com/160/ff3366/ffffff?text=AIMI'">
        </div>
        <div class="app-title">AIMI</div>
        
        <div class="powered-by">
            POWERED BY
            <span>EAGLEARC</span>
        </div>
    </div>

    <!-- Side Drawer Menu -->
    <div class="side-menu" id="side-menu">
        <i class="fas fa-times close-menu" id="close-menu"></i>
        <div class="menu-header">
            <h2>AIMI</h2>
            <p style="font-size: 0.8rem; color: var(--primary-color);">By Eaglearc</p>
        </div>
        <div class="menu-links">
            <div><i class="fas fa-robot"></i> Aimi Guide Bot</div>
            <div><i class="fas fa-heart"></i> Subscription Plans</div>
            <div><i class="fas fa-user-circle"></i> Profile Settings</div>
            <div><i class="fas fa-history"></i> Clear Chat</div>
            <div style="color: #ff4757;"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="app-container">
        
        <!-- Header -->
        <header>
            <div class="header-left">
                <i class="fas fa-bars menu-btn" id="open-menu"></i>
                <div class="active-girl-img">R</div>
                <div>
                    <h3 style="font-size: 1.1rem; margin:0;">Rani <i class="fas fa-crown" style="color: gold; font-size: 0.8rem;"></i></h3>
                    <p style="font-size: 0.75rem; color: #4ade80;">Online</p>
                </div>
            </div>
            <div>
                <i class="fas fa-phone-alt" style="margin-right: 15px; color: var(--text-muted);"></i>
                <i class="fas fa-video" style="color: var(--text-muted);"></i>
            </div>
        </header>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="message msg-ai">Kya hua? Itni der se reply kyun nahi kiya tumne? 😒</div>
            <div class="message msg-user">Sorry yaar, meeting mein tha. Gussa mat kar na.</div>
            <div class="message msg-ai">Achha ji! Meeting mere se zyada zaroori ho gayi ab?</div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <i class="fas fa-plus-circle" style="color:var(--text-muted); font-size:1.2rem;"></i>
            <input type="text" placeholder="Message Rani...">
            <button class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // Splash Screen Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                }, 1000);
            }, 4000); // Reduced to 4 seconds so you don't have to wait too long to test
        });

        // Menu Logic
        const sideMenu = document.getElementById('side-menu');
        document.getElementById('open-menu').addEventListener('click', () => {
            sideMenu.classList.add('open');
        });
        document.getElementById('close-menu').addEventListener('click', () => {
            sideMenu.classList.remove('open');
        });
    </script>
</body>
</html>
