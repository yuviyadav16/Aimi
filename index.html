<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0510">
    <title>Aimi - Premium AI Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0510;
            --glass-panel: rgba(20, 15, 30, 0.9);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #ff3366;
            --text-main: #ffffff;
            --text-dim: #8b8b9e;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100dvh; width: 100vw; background-color: var(--bg-deep); color: var(--text-main); overflow: hidden; font-size: 13px; }
        
        .screen { width: 100%; height: 100dvh; position: absolute; top: 0; left: 0; display: none; flex-direction: column; }
        .active-screen { display: flex !important; }

        .social-row { display: flex; justify-content: center; gap: 18px; margin-top: 10px; }
        .social-row a { color: var(--text-dim); font-size: 1.1rem; text-decoration: none; transition: 0.2s; }
        .social-row a:hover { color: var(--primary); }

        /* --- AUTH SCREEN (TicBull Style) --- */
        #auth-screen { background: radial-gradient(circle at top, #1a1016, #0a0510); justify-content: center; align-items: center; padding: 15px; z-index: 100; }
        .auth-card { background: var(--glass-panel); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); width: 100%; max-width: 340px; border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .auth-tabs { display: flex; background: rgba(0,0,0,0.5); border-radius: 10px; margin-bottom: 15px; padding: 3px; }
        .auth-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; color: var(--text-dim); font-weight: 500; border-radius: 8px; font-size: 0.8rem; }
        .auth-tab.active { background: var(--primary); color: #fff; }
        .auth-form { display: none; flex-direction: column; gap: 10px; }
        .auth-form.active { display: flex; }
        .input-wrap { display: flex; flex-direction: column; gap: 3px; position: relative; }
        .input-wrap label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
        .input-wrap input { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; font-size: 0.8rem; outline: none; }
        .input-wrap input:focus { border-color: var(--primary); }
        .toggle-pass { position: absolute; right: 12px; top: 30px; cursor: pointer; color: var(--text-dim); font-size: 0.85rem; }
        .btn-main { width: 100%; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 12px rgba(255,51,102,0.4); }
        .err-txt { color: var(--danger); font-size: 0.7rem; text-align: center; display: none; }

        /* --- MAIN APP --- */
        #main-screen { background: radial-gradient(circle at top right, rgba(255,51,102,0.05), transparent), var(--bg-deep); z-index: 50; }
        header { background: var(--glass-panel); backdrop-filter: blur(10px); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); height: 55px; }
        .btn-icon { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: #fff; width: 34px; height: 34px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 0.85rem; }
        .active-info { display: flex; flex-direction: column; align-items: center; }
        .active-info span { font-size: 0.9rem; font-weight: 600; color: var(--primary); letter-spacing: 1px; }
        .active-info small { font-size: 0.55rem; color: var(--success); }

        .chat-area { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-box { max-width: 80%; display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        .msg-box.ai { align-self: flex-start; }
        .msg-box.user { align-self: flex-end; }
        .msg-content { padding: 9px 12px; font-size: 0.8rem; line-height: 1.4; word-wrap: break-word; }
        .msg-box.ai .msg-content { background: var(--glass-panel); border: 1px solid var(--glass-border); border-radius: 0 12px 12px 12px; color: #fff; }
        .msg-box.user .msg-content { background: var(--primary); border-radius: 12px 0 12px 12px; color: #fff; }
        .msg-time { font-size: 0.5rem; color: var(--text-dim); margin-top: 2px; }
        .msg-box.user .msg-time { text-align: right; }
        .emoji-3d { font-size: 2rem; display: inline-block; animation: floatEmoji 2s infinite ease-in-out; }
        .media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 4px; }
        .media-grid img { width: 100%; border-radius: 6px; }

        .input-bar { background: var(--glass-panel); backdrop-filter: blur(10px); padding: 8px 12px; border-top: 1px solid var(--glass-border); display: flex; align-items: center; gap: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
        .input-bar input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 8px; padding: 9px 12px; color: #fff; font-size: 0.8rem; outline: none; }
        .send-btn { background: var(--primary); color: #fff; border: none; width: 36px; height: 36px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        /* --- SIDE PANELS (TicBull Style Layout) --- */
        .panel { position: absolute; top: 0; height: 100%; width: 85%; max-width: 300px; background: rgba(12, 8, 18, 0.98); backdrop-filter: blur(20px); z-index: 120; transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; border-right: 1px solid var(--glass-border); }
        .panel-left { left: -100%; } .panel-left.open { left: 0; }
        .panel-right { right: -100%; border-left: 1px solid var(--glass-border); border-right: none; } .panel-right.open { right: 0; }
        
        .panel-header { padding: 12px 15px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .panel-header h3 { font-size: 0.85rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .panel-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

        /* TicBull Profile Card */
        .profile-card { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 5px; position: relative; }
        .profile-card img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--primary); }
        .profile-card h4 { font-size: 0.85rem; margin-bottom: 1px; }
        .profile-card p { font-size: 0.65rem; color: var(--text-dim); }
        .profile-card .edit-icon { position: absolute; right: 10px; top: 10px; color: var(--text-dim); font-size: 0.8rem; cursor: pointer; }

        .girl-card { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 7px; cursor: pointer; }
        .girl-card.active { border-color: var(--primary); background: rgba(255,51,102,0.1); }
        .girl-card img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; }
        .girl-card h4 { font-size: 0.75rem; margin-bottom: 1px; }
        .girl-card p { font-size: 0.6rem; color: var(--text-dim); }

        .history-card { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; background: rgba(0,0,0,0.2); border-radius: 8px; font-size: 0.7rem; cursor: pointer; border: 1px solid var(--glass-border); }
        .menu-row { padding: 9px 10px; background: rgba(255,255,255,0.02); border-radius: 8px; font-size: 0.75rem; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); z-index: 110; display: none; }
        .overlay.show { display: block; }

        /* WARNING MODAL */
        .modal-box { background: var(--bg-deep); width: 85%; max-width: 270px; border-radius: 14px; padding: 18px; border: 1px solid var(--danger); text-align: center; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 250; display: none; box-shadow: 0 10px 30px rgba(255,71,87,0.3); }
        .modal-box h3 { font-size: 0.9rem; margin-bottom: 4px; }
        .modal-box p { font-size: 0.65rem; color: var(--text-dim); margin-bottom: 12px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatEmoji { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
</head>
<body>

<div id="app-wrapper" style="width:100%; height:100dvh; position:relative; overflow:hidden;">
    <input type="file" id="media-file" accept="image/*" multiple style="display:none;" onchange="uploadMedia(event)">
    <input type="file" id="dp-file" accept="image/*" style="display:none;" onchange="updateDP(event)">

    <!-- 1. AUTH SCREEN -->
    <div id="auth-screen" class="screen active-screen">
        <div style="margin:auto; width:100%; max-width:330px; padding:12px;">
            <div style="text-align:center; margin-bottom:15px;">
                <img src="98.30.png" onerror="this.src='https://via.placeholder.com/55/ff3366/ffffff?text=A'" style="width:55px; border-radius:14px; box-shadow:0 0 15px rgba(255,51,102,0.4);">
                <h2 style="font-size:1.2rem; margin-top:8px; font-weight:600;">AIMI</h2>
                <p style="font-size:0.7rem; color:var(--text-dim);">Your Premium AI Companion</p>
            </div>
            
            <div class="auth-card">
                <div class="auth-tabs">
                    <div class="auth-tab active" onclick="switchAuth('login')">Sign In</div>
                    <div class="auth-tab" onclick="switchAuth('signup')">Sign Up</div>
                </div>

                <!-- Login -->
                <div id="form-login" class="auth-form active">
                    <div class="input-wrap">
                        <label>Email</label>
                        <input type="email" id="l-email" placeholder="Enter email">
                    </div>
                    <div class="input-wrap">
                        <label>Password</label>
                        <input type="password" id="l-pass" placeholder="Enter password">
                        <i class="fas fa-eye toggle-pass" onclick="togglePass('l-pass', this)"></i>
                    </div>
                    <div class="err-txt" id="l-err"></div>
                    <button class="btn-main" onclick="doLogin()">Sign In</button>
                </div>

                <!-- Signup -->
                <div id="form-signup" class="auth-form">
                    <div class="input-wrap">
                        <label>Name</label>
                        <input type="text" id="s-name" placeholder="Your name">
                    </div>
                    <div class="input-wrap">
                        <label>Email</label>
                        <input type="email" id="s-email" placeholder="Valid email">
                    </div>
                    <div class="input-wrap">
                        <label>Date of Birth (18+)</label>
                        <input type="date" id="s-dob">
                    </div>
                    <div class="input-wrap">
                        <label>Password</label>
                        <input type="password" id="s-pass" placeholder="Create password">
                        <i class="fas fa-eye toggle-pass" onclick="togglePass('s-pass', this)"></i>
                    </div>
                    <div class="err-txt" id="s-err"></div>
                    <button class="btn-main" onclick="doSignup()">Create Account</button>
                </div>

                <div class="social-row" style="margin-top:12px; padding-top:8px; border-top:1px solid var(--glass-border);">
                    <a href="https://www.instagram.com/justanajnabi" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://t.me/eagleaarc" target="_blank"><i class="fab fa-telegram"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. MAIN APP SCREEN -->
    <div id="main-screen" class="screen">
        <header>
            <div class="btn-icon" onclick="openPanel('left-panel')"><i class="fas fa-bars"></i></div>
            <div class="active-info">
                <span id="head-title">RANI</span>
                <small>Active Now</small>
            </div>
            <div class="btn-icon" onclick="openPanel('right-panel')" style="border-color:var(--primary); color:var(--primary);">
                <i class="fas fa-heart"></i>
            </div>
        </header>

        <div class="chat-area" id="chat-box"></div>

        <div class="input-bar">
            <div class="btn-icon" style="border:none; background:transparent;" onclick="document.getElementById('media-file').click()">
                <i class="fas fa-paperclip" style="color:var(--text-dim);"></i>
            </div>
            <input type="text" id="user-input" placeholder="Type romantic message...">
            <button class="send-btn" onclick="sendText()"><i class="fas fa-paper-plane"></i></button>
        </div>

        <!-- LEFT PANEL (TICBULL STYLE MENU & PROFILE) -->
        <div class="panel panel-left" id="left-panel">
            <div class="panel-header">
                <h3>Menu & Profile</h3>
                <i class="fas fa-times" onclick="closePanels()" style="cursor:pointer; color:var(--text-dim);"></i>
            </div>
            <div class="panel-body">
                <!-- TicBull Profile Card -->
                <div class="profile-card">
                    <img src="https://via.placeholder.com/50/222/fff?text=U" id="menu-dp">
                    <div>
                        <h4 id="menu-name">User</h4>
                        <p id="menu-email">user@mail.com</p>
                        <p id="menu-age" style="color:var(--success);">Age: 18+ Years</p>
                    </div>
                    <i class="fas fa-pen edit-icon" onclick="document.getElementById('dp-file').click()"></i>
                </div>

                <div class="menu-row" onclick="closePanels()"><i class="fas fa-book-open" style="color:var(--primary);"></i> Guide & Features</div>
                <div class="menu-row" style="color:var(--danger);" onclick="triggerWarning('logout')"><i class="fas fa-sign-out-alt"></i> Log Out Account</div>
                <div class="menu-row" style="color:var(--danger);" onclick="triggerWarning('delete_acc')"><i class="fas fa-trash"></i> Delete Account</div>

                <div style="margin-top:auto;">
                    <p style="font-size:0.6rem; color:var(--text-dim); text-align:center;">Official Support: eaglearc@support</p>
                    <div class="social-row">
                        <a href="https://www.instagram.com/justanajnabi" target="_blank"><i class="fab fa-instagram"></i></a>
                        <a href="https://t.me/eagleaarc" target="_blank"><i class="fab fa-telegram"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (5 GIRLS & SEPARATE HISTORY) -->
        <div class="panel panel-right" id="right-panel">
            <div class="panel-header">
                <h3>Companions</h3>
                <i class="fas fa-times" onclick="closePanels()" style="cursor:pointer; color:var(--text-dim);"></i>
            </div>
            <div class="panel-body">
                <div style="font-size:0.6rem; color:var(--text-dim); text-transform:uppercase;">Select Girlfriend</div>
                <div id="girls-menu-list" style="display:flex; flex-direction:column; gap:5px;"></div>

                <div style="font-size:0.6rem; color:var(--text-dim); text-transform:uppercase; margin-top:8px;">Chat History</div>
                <div id="history-menu-list" style="display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto;"></div>

                <div class="social-row">
                    <a href="https://www.instagram.com/justanajnabi" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://t.me/eagleaarc" target="_blank"><i class="fab fa-telegram"></i></a>
                </div>
            </div>
        </div>

        <div class="overlay" id="app-overlay" onclick="closePanels()"></div>
    </div>

    <!-- WARNING MODAL -->
    <div class="overlay" id="modal-overlay" style="z-index:200;"></div>
    <div class="modal-box" id="warning-modal">
        <i class="fas fa-exclamation-triangle" style="font-size:1.8rem; color:var(--danger); margin-bottom:8px;"></i>
        <h3 id="modal-title">Warning</h3>
        <p id="modal-desc">Are you sure?</p>
        <div style="display:flex; gap:6px;">
            <button class="btn-main" style="background:#222; font-size:0.7rem; padding:7px;" onclick="closeModal()">Cancel</button>
            <button class="btn-main" style="background:var(--danger); font-size:0.7rem; padding:7px;" id="modal-confirm-btn">Confirm</button>
        </div>
        <div style="font-size:0.55rem; color:var(--text-dim); margin-top:10px; border-top:1px solid var(--glass-border); padding-top:6px;">
            Contact for any problem
            <div class="social-row" style="margin-top:3px;">
                <a href="https://www.instagram.com/justanajnabi" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://t.me/eagleaarc" target="_blank"><i class="fab fa-telegram"></i></a>
            </div>
        </div>
    </div>
</div>

<script>
    // --- DATA ---
    const girlsData = {
        'Rani': { img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80', desc: 'Bold Queen', intro: "Tumhe kitni baar kaha hai jaldi reply kiya karo! 😒" },
        'Aditi': { img: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80', desc: 'Caring Wifey', intro: "Aapne time pe khana khaya aaj?" },
        'Priya': { img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80', desc: 'Playful Partner', intro: "Bore ho rahi hoon, chalo kuch fun karte hain 😉" },
        'Suhani': { img: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=100&q=80', desc: 'Sweet Love', intro: "Aapka message dekh kar smile aa jati hai 🙈" },
        'Arohi': { img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&q=80', desc: 'Deep Soul', intro: "Tumhari yaad aa rahi thi..." }
    };

    const historyData = {
        'Rani': [{id: 1, title: 'Late night fight', text: "Main aapse baat nahi karungi."}],
        'Aditi': [{id: 2, title: 'Health discussion', text: "Dawai time pe li thi na?"}],
        'Priya': [{id: 3, title: 'Game night plans', text: "Kahan ho tum?"}],
        'Suhani': [{id: 4, title: 'Poetry chat', text: "Aapko shayari pasand hai?"}],
        'Arohi': [{id: 5, title: 'Deep thoughts', text: "Suno na..."}]
    };

    let activeGirl = 'Rani';
    let currentUser = { name: 'User', email: 'user@mail.com', age: '18+ Years' };

    // --- AUTH LOGIC ---
    function switchAuth(type) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('form-signup').style.display = 'none';
        if(type === 'login') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            document.getElementById('form-login').style.display = 'flex';
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            document.getElementById('form-signup').style.display = 'flex';
        }
    }

    function togglePass(id, icon) {
        const input = document.getElementById(id);
        if(input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    if(!localStorage.getItem('aimi_users')) localStorage.setItem('aimi_users', JSON.stringify([]));

    function doSignup() {
        const name = document.getElementById('s-name').value;
        const email = document.getElementById('s-email').value;
        const dob = document.getElementById('s-dob').value;
        const pass = document.getElementById('s-pass').value;
        const err = document.getElementById('s-err');
        
        err.style.display = 'block';
        if(!name || !email || !dob || !pass) { err.innerText = "All fields required!"; return; }
        
        const ageYears = Math.abs(new Date(Date.now() - new Date(dob).getTime()).getUTCFullYear() - 1970);
        if(ageYears < 18) { err.innerText = "Must be 18+ to use Aimi."; return; }
        
        let users = JSON.parse(localStorage.getItem('aimi_users'));
        if(users.find(u => u.email === email)) { err.innerText = "Email already registered!"; return; }

        users.push({ name, email, dob, pass });
        localStorage.setItem('aimi_users', JSON.stringify(users));

        currentUser = { name, email, age: ageYears + ' Years' };
        err.style.display = 'none';
        enterApp();
    }

    function doLogin() {
        const email = document.getElementById('l-email').value;
        const pass = document.getElementById('l-pass').value;
        const err = document.getElementById('l-err');
        
        err.style.display = 'block';
        if(!email || !pass) { err.innerText = "Enter credentials!"; return; }
        
        let users = JSON.parse(localStorage.getItem('aimi_users'));
        let found = users.find(u => u.email === email && u.pass === pass);
        if(!found) { err.innerText = "Invalid credentials or account not found!"; return; }

        const ageYears = Math.abs(new Date(Date.now() - new Date(found.dob || '2000-01-01').getTime()).getUTCFullYear() - 1970);
        currentUser = { name: found.name, email: found.email, age: (ageYears > 10 ? ageYears : 18) + ' Years' };

        err.style.display = 'none';
        enterApp();
    }

    function enterApp() {
        document.getElementById('auth-screen').classList.remove('active-screen');
        document.getElementById('main-screen').classList.add('active-screen');
        
        // Update TicBull Profile Card
        document.getElementById('menu-name').innerText = currentUser.name;
        document.getElementById('menu-email').innerText = currentUser.email;
        document.getElementById('menu-age').innerText = `Age: ${currentUser.age}`;

        buildGirlsMenu();
        loadGirl('Rani');
    }

    // --- PANEL LOGIC ---
    function openPanel(id) {
        closePanels();
        document.getElementById(id).classList.add('open');
        document.getElementById('app-overlay').classList.add('show');
        if(id === 'right-panel') buildHistoryMenu();
    }

    function closePanels() {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
        document.getElementById('app-overlay').classList.remove('show');
    }

    // --- BUILD DYNAMIC MENUS ---
    function buildGirlsMenu() {
        const list = document.getElementById('girls-menu-list');
        list.innerHTML = '';
        for(let g in girlsData) {
            list.innerHTML += `
                <div class="girl-card ${g === activeGirl ? 'active' : ''}" onclick="loadGirl('${g}')">
                    <img src="${girlsData[g].img}">
                    <div>
                        <h4>${g}</h4>
                        <p>${girlsData[g].desc}</p>
                    </div>
                </div>
            `;
        }
    }

    function buildHistoryMenu() {
        const list = document.getElementById('history-menu-list');
        list.innerHTML = '';
        const items = historyData[activeGirl] || [];
        
        if(items.length === 0) {
            list.innerHTML = `<p style="font-size:0.6rem; color:var(--text-dim); text-align:center;">No history.</p>`;
            return;
        }

        items.forEach(h => {
            list.innerHTML += `
                <div class="history-card" onclick="loadOldChat('${h.title}', '${h.text}')">
                    <span><i class="far fa-comment-alt" style="margin-right:4px;"></i> ${h.title}</span>
                    <i class="fas fa-trash" style="color:var(--text-dim); padding:4px;" onclick="event.stopPropagation(); deleteHistory(${h.id})"></i>
                </div>
            `;
        });
    }

    function loadGirl(name) {
        activeGirl = name;
        document.getElementById('head-title').innerText = name.toUpperCase();
        buildGirlsMenu();
        closePanels();
        
        document.getElementById('chat-box').innerHTML = '';
        pushMsg(girlsData[name].intro, 'ai');
    }

    function loadOldChat(title, text) {
        closePanels();
        document.getElementById('chat-box').innerHTML = '';
        pushMsg(`*History: ${title}*`, 'ai');
        pushMsg(text, 'ai');
    }

    function deleteHistory(id) {
        historyData[activeGirl] = historyData[activeGirl].filter(h => h.id !== id);
        buildHistoryMenu();
    }

    // --- WARNING MODAL ---
    function triggerWarning(type) {
        closePanels();
        const modal = document.getElementById('warning-modal');
        const overlay = document.getElementById('modal-overlay');
        const title = document.getElementById('modal-title');
        const desc = document.getElementById('modal-desc');
        const btn = document.getElementById('modal-confirm-btn');

        overlay.classList.add('show');
        modal.style.display = 'block';

        if(type === 'logout') {
            title.innerText = "Log Out";
            desc.innerText = "Are you sure you want to log out?";
            btn.onclick = () => location.reload();
        } else if(type === 'delete_acc') {
            title.innerText = "Delete Account";
            desc.innerText = "Are you sure you want to permanently delete your account?";
            btn.onclick = () => location.reload();
        }
    }

    function closeModal() {
        document.getElementById('warning-modal').style.display = 'none';
        document.getElementById('modal-overlay').classList.remove('show');
    }

    // --- CHAT & MEDIA ---
    function isEmoji(str) {
        return /^[\u{1f300}-\u{1f5ff}\u{1f900}-\u{1f9ff}\u{1f600}-\u{1f64f}\u{1f680}-\u{1f6ff}\u{2600}-\u{26ff}\u{2700}-\u{27bf}\s]+$/u.test(str.trim());
    }

    function sendText() {
        const inp = document.getElementById('user-input');
        const txt = inp.value.trim();
        if(!txt) return;

        if(isEmoji(txt)) {
            pushMsg(`<span class="emoji-3d">${txt}</span>`, 'user');
        } else {
            pushMsg(txt, 'user');
        }
        inp.value = '';
        setTimeout(() => pushMsg("Tumse baat karke bahut acha laga! ❤️", 'ai'), 1200);
    }

    function uploadMedia(e) {
        const files = e.target.files;
        if(files.length === 0) return;
        let html = `<div class="media-grid">`;
        for(let i=0; i<Math.min(files.length, 10); i++) {
            html += `<img src="${URL.createObjectURL(files[i])}">`;
        }
        html += `</div>`;
        pushMsg(html, 'user');
        e.target.value = '';
        setTimeout(() => pushMsg("Yeh pictures kitni achhi hain! 😍", 'ai'), 1500);
    }

    function pushMsg(content, type) {
        const box = document.getElementById('chat-box');
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        box.innerHTML += `
            <div class="msg-box ${type}">
                <div class="msg-content">${content}</div>
                <div class="msg-time">${time}</div>
            </div>
        `;
        box.scrollTop = box.scrollHeight;
    }

    function updateDP(e) {
        if(e.target.files[0]) {
            const url = URL.createObjectURL(e.target.files[0]);
            document.getElementById('menu-dp').src = url;
        }
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendText();
    });
</script>
</body>
</html>
